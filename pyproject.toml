[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factor-backtester"
version = "0.1.0"
description = "Multi-asset equity factor backtester comparing DIY systematic factor portfolios against benchmark ETFs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.22.0",
    "streamlit>=1.37.0",
    "pyarrow>=16.0.0",
    # Congress mirror
    "alpaca-py>=0.20.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "schedule>=1.2.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
